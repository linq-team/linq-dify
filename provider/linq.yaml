identity:
  author: linq-team
  name: linq
  label:
    en_US: Linq
  description:
    en_US: Send and receive iMessage, RCS, and SMS in Dify agents and workflows through
      Linq.
  icon: icon.svg
  tags:
  - social
  - productivity
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: Linq API key
    help:
      en_US: Enter your Linq Partner API key without Bearer. Use a key with access
        to the intended lines.
    placeholder:
      en_US: Linq API key
    url: https://docs.linqapp.com/channel/imessage/
tools:
- tools/send_message.yaml
- tools/list_phone_numbers.yaml
- tools/get_chat.yaml
- tools/list_messages.yaml
- tools/mark_read.yaml
- tools/set_typing.yaml
extra:
  python:
    source: provider/linq.py
